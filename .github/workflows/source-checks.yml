name: Chat integration source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - name: Check Python source and staging contracts
        run: |
          mkdir -p -m 700 build
          python3 -B -m unittest discover -s tests -v
      - name: Check backup source contracts with synthetic fixtures
        run: node --test tests/*.test.mjs

# These checks use synthetic inputs and local test fixtures. They do not install
# or build Signal, execute its runtime, or prove a live core/peer route.
