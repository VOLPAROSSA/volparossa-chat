name: Native Signal receipts

on:
  workflow_dispatch:
    inputs:
      volume:
        description: Send 260 native Signal texts through ten signed mailbox grant pairs
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/native-receipts.yml'
      - 'scripts/**'
      - 'tests/native/**'
      - 'packaging/systemd/**'
      - 'patches/**'
      - 'overlay/**'
      - 'upstream-lock.json'

permissions:
  contents: read

concurrency:
  group: native-signal-receipts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.14'
      - name: Install native Desktop runtime libraries
        run: |
          sudo apt-get -q update
          sudo apt-get install --yes --no-install-recommends \
            bubblewrap xvfb xauth protobuf-compiler pkg-config libgtk-3-0 libnss3 libnspr4 libgbm1 libasound2 \
            libpulse0 libatk-bridge2.0-0 libatk1.0-0 libatspi2.0-0 libcups2 \
            libx11-6 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 libxcb1 \
            libxkbcommon0 libdrm2 libxshmfence1 fonts-dejavu-core
      - name: Check unprivileged build isolation before downloading dependencies
        run: bwrap --unshare-user --unshare-pid --unshare-net --cap-drop ALL --ro-bind / / --proc /proc --dev /dev -- /usr/bin/true
      - name: Stage verified source and tools
        run: |
          mkdir -m 0700 build
          python3 -B scripts/stage_signal_source.py --download
          python3 -B scripts/stage_node.py --with-npm
          python3 -B scripts/stage_pnpm.py --download
          python3 -B scripts/apply_signal_overlay.py
      - name: Install the locked package graph and pinned native components
        run: |
          python3 -B scripts/stage_signal_dependencies.py --download
          python3 -B scripts/stage_signal_native.py --download --artifact electron
          python3 -B scripts/stage_signal_native.py --download --artifact ringrtc
          python3 -B scripts/install_signal_native.py --artifact electron
          python3 -B scripts/install_signal_native.py --artifact ringrtc
      - name: Build the pinned Desktop offline
        run: |
          if ! python3 -B scripts/build_signal_candidate.py --build; then
            # Only upstream compiler diagnostics exist at this stage.
            find build/signal-candidate-build -name 'attempt-*.log' -type f -exec tail -c 3000 {} \;
            exit 1
          fi
      - name: Exchange encrypted receipts and reopen the native profile
        run: python3 -B scripts/run_native_receipts.py
      - name: Check out the reviewed Core mailbox fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: VOLPAROSSA/volparossa
          ref: 67ae4b6948f77cd33fd2af719878fc2d9b14ec96
          path: build/paired-core
          persist-credentials: false
      - name: Prepare the locked Core build
        working-directory: build/paired-core
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup run 1.89.0 cargo fetch --locked --target x86_64-unknown-linux-gnu
      - name: Deposit with the recipient offline and confirm from the native Signal inbox
        env:
          RUSTUP_TOOLCHAIN: 1.89.0
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
        run: python3 -B scripts/run_native_mailbox.py --core-source build/paired-core
      - name: Deliver offline through the enabled owner workers across stop and restart
        env:
          RUSTUP_TOOLCHAIN: 1.89.0
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
        run: python3 -B scripts/run_native_mailbox.py --core-source build/paired-core --worker
      - name: Exchange 260 native texts through ten signed grant pairs
        if: inputs.volume == true
        env:
          RUSTUP_TOOLCHAIN: 1.89.0
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
        run: python3 -B scripts/run_native_mailbox.py --core-source build/paired-core --volume
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-signal-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/native-receipts-result.json
            build/native-mailbox-result.json
            build/native-mailbox-worker-result.json
            build/native-mailbox-volume-result.json
          if-no-files-found: error
